<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Main Packing List</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#98805d",
                        "status-warning": "#d97706",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#271901",
                        "primary-fixed-dim": "#bec6e0",
                        "on-surface-variant": "#45464d",
                        "on-tertiary-fixed-variant": "#574425",
                        "background": "#f7f9fb",
                        "surface-container-highest": "#e0e3e5",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#131b2e",
                        "primary": "#000000",
                        "on-error-container": "#93000a",
                        "text-muted": "#64748b",
                        "on-secondary-container": "#fefcff",
                        "secondary-container": "#316bf3",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef0",
                        "error": "#ba1a1a",
                        "on-primary-container": "#7c839b",
                        "surface-bright": "#f7f9fb",
                        "tertiary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "primary-container": "#131b2e",
                        "surface": "#f7f9fb",
                        "tertiary-fixed": "#fcdeb5",
                        "secondary": "#0051d5",
                        "surface-tint": "#565e74",
                        "status-success": "#059669",
                        "outline-variant": "#c6c6cd",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container-high": "#e6e8ea",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#271901",
                        "secondary-fixed": "#dbe1ff",
                        "status-error": "#dc2626",
                        "inverse-primary": "#bec6e0",
                        "inverse-surface": "#2d3133",
                        "surface-border": "#e2e8f0",
                        "outline": "#76777d",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#dae2fd",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed": "#00174b",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-gap": "12px",
                        "touch-target": "56px",
                        "card-padding": "20px",
                        "base-grid": "4px",
                        "margin-edge": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "status-badge": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "status-badge": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body { background-color: #f8fafc; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-on-background font-body-md min-h-screen flex flex-col pb-[80px] md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest w-full top-0 sticky border-b border-surface-border z-40">
<div class="flex justify-between items-center px-margin-edge h-touch-target w-full">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">precision_manufacturing</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-background">BLP Inventory</h1>
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-4xl mx-auto px-margin-edge py-6">
<!-- Header Section -->
<div class="mb-6">
<h2 class="font-display-lg text-display-lg mb-2">Packing List</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Job #4928 - Commercial Shoot</p>
</div>
<!-- Filter Tabs -->
<div class="flex space-x-2 mb-stack-gap overflow-x-auto hide-scrollbar pb-2">
<button class="px-4 h-touch-target rounded-full border-2 border-primary bg-primary text-on-primary font-status-badge text-status-badge flex items-center justify-center whitespace-nowrap active:scale-95 transition-transform">
                All Items
            </button>
<button class="px-4 h-touch-target rounded-full border border-surface-border bg-surface-container-lowest text-on-surface font-status-badge text-status-badge flex items-center justify-center whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-low">
                To Load
            </button>
<button class="px-4 h-touch-target rounded-full border border-surface-border bg-surface-container-lowest text-on-surface font-status-badge text-status-badge flex items-center justify-center whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-low">
                On Set
            </button>
</div>
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">LOADING PROGRESS</span>
<span class="font-label-caps text-label-caps text-primary">12/45 ITEMS</span>
</div>
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-status-success rounded-full" style="width: 26%;"></div>
</div>
</div>
<!-- Equipment Cards List -->
<div class="flex flex-col gap-stack-gap">
<!-- Card 1: On Set -->
<div class="relative bg-surface-container-lowest border border-surface-border rounded-lg overflow-hidden shadow-sm touch-pan-x">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-success"></div>
<div class="p-card-padding pl-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
<div class="flex-grow">
<div class="flex items-center gap-2 mb-1">
<span class="inline-block px-2 py-1 rounded bg-status-success text-on-primary font-label-caps text-label-caps">ON SET</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Lighting</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Arri Skypanel S60-C</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">ID: LGT-042 • Case #3</p>
</div>
<!-- Giga-Stepper -->
<div class="flex items-center gap-1 bg-surface-container-low rounded-lg p-1 border border-surface-border">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-lowest border border-surface-border rounded active:border-primary active:border-2 transition-all">
<span class="material-symbols-outlined text-on-surface">remove</span>
</button>
<div class="w-14 flex items-center justify-center font-label-caps text-[20px] font-bold text-primary">
                            2/2
                        </div>
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-lowest border border-surface-border rounded active:border-primary active:border-2 transition-all text-on-surface-variant opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- Card 2: To Load -->
<div class="relative bg-surface-container-lowest border border-surface-border rounded-lg overflow-hidden shadow-sm touch-pan-x">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-outline-variant"></div>
<!-- Swipe Hint Background -->
<div class="absolute inset-y-0 right-0 w-1/4 bg-status-success flex items-center justify-end pr-4 opacity-0 transition-opacity">
<span class="material-symbols-outlined text-white">check</span>
</div>
<div class="p-card-padding pl-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 relative z-10 bg-surface-container-lowest transition-transform">
<div class="flex-grow">
<div class="flex items-center gap-2 mb-1">
<span class="inline-block px-2 py-1 rounded border-2 border-outline-variant text-outline font-label-caps text-label-caps">TO LOAD</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Grip</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">C-Stand 40"</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">ID: GRP-118 • Loose</p>
</div>
<!-- Giga-Stepper -->
<div class="flex items-center gap-1 bg-surface-container-low rounded-lg p-1 border border-surface-border">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-lowest border border-surface-border rounded active:border-primary active:border-2 transition-all">
<span class="material-symbols-outlined text-on-surface">remove</span>
</button>
<div class="w-14 flex items-center justify-center font-label-caps text-[20px] font-bold text-primary">
                            0/6
                        </div>
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-lowest border border-surface-border rounded active:border-primary active:border-2 transition-all text-primary">
<span class="material-symbols-outlined text-on-surface">add</span>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container-lowest border-t border-surface-border md:hidden">
<div class="flex justify-around items-center w-full px-base-grid pb-safe h-full">
<button class="flex flex-col items-center justify-center text-outline py-1 hover:bg-surface-container active:scale-90 transition-transform w-1/4 h-full rounded-lg">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-caps text-label-caps">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-lg px-spacing-gutter py-1 hover:bg-surface-container active:scale-90 transition-transform w-1/4 h-5/6">
<span class="material-symbols-outlined mb-1">package_2</span>
<span class="font-label-caps text-label-caps">Packing</span>
</button>
<button class="flex flex-col items-center justify-center text-outline py-1 hover:bg-surface-container active:scale-90 transition-transform w-1/4 h-full rounded-lg">
<span class="material-symbols-outlined mb-1">inventory_2</span>
<span class="font-label-caps text-label-caps">Catalog</span>
</button>
<button class="flex flex-col items-center justify-center text-outline py-1 hover:bg-surface-container active:scale-90 transition-transform w-1/4 h-full rounded-lg">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label-caps text-label-caps">History</span>
</button>
</div>
</nav>
</body></html>
