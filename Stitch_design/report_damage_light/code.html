<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Report Damage - BLP Inventory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#98805d",
                        "status-warning": "#d97706",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#271901",
                        "primary-fixed-dim": "#bec6e0",
                        "on-surface-variant": "#45464d",
                        "on-tertiary-fixed-variant": "#574425",
                        "background": "#f7f9fb",
                        "surface-container-highest": "#e0e3e5",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#131b2e",
                        "primary": "#000000",
                        "on-error-container": "#93000a",
                        "text-muted": "#64748b",
                        "on-secondary-container": "#fefcff",
                        "secondary-container": "#316bf3",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef0",
                        "error": "#ba1a1a",
                        "on-primary-container": "#7c839b",
                        "surface-bright": "#f7f9fb",
                        "tertiary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "primary-container": "#131b2e",
                        "surface": "#f7f9fb",
                        "tertiary-fixed": "#fcdeb5",
                        "secondary": "#0051d5",
                        "surface-tint": "#565e74",
                        "status-success": "#059669",
                        "outline-variant": "#c6c6cd",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container-high": "#e6e8ea",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#271901",
                        "secondary-fixed": "#dbe1ff",
                        "status-error": "#dc2626",
                        "inverse-primary": "#bec6e0",
                        "inverse-surface": "#2d3133",
                        "surface-border": "#e2e8f0",
                        "outline": "#76777d",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#dae2fd",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed": "#00174b",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-gap": "12px",
                        "touch-target": "56px",
                        "card-padding": "20px",
                        "base-grid": "4px",
                        "margin-edge": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "status-badge": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "status-badge": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky border-b border-surface-border bg-surface-container-lowest flex justify-between items-center px-margin-edge h-touch-target z-40">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-on-background">Report Damage</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content -->
<main class="flex-grow p-gutter flex flex-col gap-stack-gap pb-32 max-w-2xl mx-auto w-full">
<!-- Item Info Card -->
<section class="bg-surface-container-lowest border border-surface-border rounded-lg p-card-padding flex items-start gap-4 shadow-sm relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="w-16 h-16 bg-surface-container rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-3xl text-on-surface-variant" data-icon="lightbulb">lightbulb</span>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1">EQUIPMENT</p>
<h2 class="font-headline-sm text-headline-sm">Arri Skypanel S60 #02</h2>
<p class="font-body-sm text-body-sm text-text-muted mt-1">SN: ARR-SK60-0024</p>
</div>
</section>
<!-- Severity Selection -->
<section class="mt-4">
<h3 class="font-body-lg text-body-lg font-semibold mb-3">Severity Level</h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-stack-gap">
<!-- Scratch -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="severity" type="radio" value="scratch">
<div class="bg-surface-container-lowest border border-surface-border rounded-lg p-4 flex flex-col items-center justify-center gap-2 h-24 hover:bg-surface-container-high transition-colors peer-checked:border-primary peer-checked:border-2 peer-checked:bg-surface-container-low active:scale-95 duration-100">
<span class="material-symbols-outlined text-status-warning" data-icon="gesture">gesture</span>
<span class="font-status-badge text-status-badge">Scratch</span>
</div>
</label>
<!-- Malfunction -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="severity" type="radio" value="malfunction">
<div class="bg-surface-container-lowest border border-surface-border rounded-lg p-4 flex flex-col items-center justify-center gap-2 h-24 hover:bg-surface-container-high transition-colors peer-checked:border-status-warning peer-checked:border-2 peer-checked:bg-orange-50 active:scale-95 duration-100">
<span class="material-symbols-outlined text-status-warning" data-icon="settings_alert">settings_alert</span>
<span class="font-status-badge text-status-badge text-status-warning">Malfunction</span>
</div>
</label>
<!-- Critical -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="severity" type="radio" value="critical">
<div class="bg-surface-container-lowest border border-surface-border rounded-lg p-4 flex flex-col items-center justify-center gap-2 h-24 hover:bg-surface-container-high transition-colors peer-checked:border-status-error peer-checked:border-2 peer-checked:bg-red-50 active:scale-95 duration-100">
<span class="material-symbols-outlined text-status-error" data-icon="warning">warning</span>
<span class="font-status-badge text-status-badge text-status-error">Critical</span>
</div>
</label>
</div>
</section>
<!-- Camera Evidence -->
<section class="mt-4">
<h3 class="font-body-lg text-body-lg font-semibold mb-3">Photographic Evidence</h3>
<div class="bg-surface-container-lowest border border-surface-border border-dashed rounded-lg h-64 flex flex-col items-center justify-center gap-4 hover:bg-surface-container-high transition-colors cursor-pointer group">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl text-on-surface-variant" data-icon="photo_camera">photo_camera</span>
</div>
<div class="text-center">
<p class="font-body-md text-body-md font-semibold">Tap to capture photo</p>
<p class="font-body-sm text-body-sm text-text-muted">High-contrast environment recommended</p>
</div>
</div>
</section>
<!-- Notes -->
<section class="mt-4">
<h3 class="font-body-lg text-body-lg font-semibold mb-3">Additional Notes</h3>
<textarea class="w-full bg-surface-container-lowest border border-surface-border rounded-lg p-4 min-h-[120px] focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow resize-y" placeholder="Describe the damage in detail..."></textarea>
</section>
</main>
<!-- Bottom Action Bar (Contextual FAB replacement for transactional screen) -->
<div class="fixed bottom-0 left-0 w-full p-gutter bg-surface-container-lowest border-t border-surface-border z-50">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 bg-primary text-on-primary font-body-lg text-body-lg font-bold h-touch-target rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-100 shadow-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
                Save and Send
            </button>
</div>
</div>
</body></html>
